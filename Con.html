<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iframe Sandbox Tool</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; }
  textarea { width: 100%; height: 80px; margin-bottom: 10px; box-sizing: border-box; }
  button { padding: 10px 15px; cursor: pointer; }
  iframe { width: 100%; height: 400px; border: 1px solid #ccc; margin-top: 10px; }
  
  /* Styled download link instead of nested button */
  .download-btn {
    display: inline-block;
    padding: 8px 12px;
    background-color: #f0f0f0;
    color: #000;
    text-decoration: none;
    border: 1px solid #767676;
    border-radius: 2px;
    font-size: 13.333px;
    font-family: Arial, sans-serif;
  }
  .download-btn:hover {
    background-color: #e5e5e5;
  }
</style>
</head>
<body>

<h2>Paste Iframe Code or Website Link</h2>
<textarea id="inputBox" placeholder="Paste iframe HTML or website URL here..."></textarea>
<br>
<button id="runBtn">Sandbox It</button>

<iframe id="sandboxFrame"
        sandbox="allow-scripts"
        referrerpolicy="no-referrer">
</iframe>

<hr style="margin-top: 30px;">

<h3>Download Desktop Utility</h3>
<p>Click <a href="hta file.zip" download="sandbox.zip" class="download-btn">here</a> to download the HTA app.</p>

<script>
document.getElementById('runBtn').addEventListener('click', () => {
    const rawInput = document.getElementById('inputBox').value.trim();
    const iframe = document.getElementById('sandboxFrame');

    let url = '';

    // Extract src from iframe string or fall back to raw input
    const iframeMatch = rawInput.match(/<iframe[^>]+src=["']([^"']+)["']/i);
    if (iframeMatch) {
        url = iframeMatch[1];
    } else {
        url = rawInput;
    }

    // Validate URL construction
    try {
        const parsed = new URL(url);
        iframe.removeAttribute('srcdoc');
        iframe.src = parsed.href;
    } catch {
        alert('Invalid iframe code or URL. Ensure it includes http:// or https://');
    }
});
</script>

</body>
</html>
